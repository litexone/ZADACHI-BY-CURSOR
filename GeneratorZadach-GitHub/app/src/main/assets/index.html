<script id="gen">
/* ===== Помощники ===== */
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[R(0,a.length-1)];
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const fr=(n,d)=>{if(d<0){n=-n;d=-d}const g=gcd(n,d)||1;n/=g;d/=g;return d===1?String(n):n+"/"+d};
const M="−";
const num=n=>String(n).replace("-",M);
const lin=(a,b,v="x")=>{let s=a===0?"":a===1?v:a===-1?M+v:num(a)+v;
  if(b>0)s+=(s?" + ":"")+b;else if(b<0)s+=(s?" "+M+" ":M)+(-b);else if(!s)s="0";return s};
const quad=(a,b,c)=>{let s=a===1?"x²":a===-1?M+"x²":num(a)+"x²";
  if(b!==0){const ab=Math.abs(b);s+=(b>0?" + ":" "+M+" ")+(ab===1?"":ab)+"x"}
  if(c!==0){s+=(c>0?" + ":" "+M+" ")+Math.abs(c)}return s};
const sgn=()=>pick([-1,1]);
const dec=x=>String(Number(x.toFixed(2))).replace(".",",");
const fact=n=>n<=1?1:n*fact(n-1);
const Cmb=(n,k)=>fact(n)/(fact(k)*fact(n-k));
const T3=[[3,4,5],[5,12,13],[8,15,17],[7,24,25],[20,21,29],[6,8,10],[9,12,15]];
const sub=n=>String(n).split("").map(d=>"₀₁₂₃₄₅₆₇₈₉"[d]).join("");

/* ===== Проверка ответов ===== */
function nums(t){
  t=String(t).replace(/[−–—]/g,"-").replace(/x\s*[12]\s*=/gi,"").replace(/[₀-₉]/g,"");
  const m=t.match(/-?\d+(?:[.,]\d+)?(?:\s*\/\s*\d+)?/g)||[];
  return m.map(s=>{s=s.replace(",",".").replace(/\s/g,"");
    if(s.includes("/")){const[p,q]=s.split("/");return +p/+q}return +s});
}
function norm(t){return String(t).toLowerCase().replace(/[−–—]/g,"-").replace(/\s+/g,"")
  .replace(/>=/g,"≥").replace(/<=/g,"≤").replace(/\*/g,"").replace(/\^2/g,"²").replace(/х/g,"x")}
function check(user,ans,mode){
  if(mode==="exact")return norm(user)===norm(ans);
  const u=nums(user),a=nums(ans);
  if(!u.length||u.length!==a.length)return false;
  if(mode==="set"){u.sort((x,y)=>x-y);a.sort((x,y)=>x-y)}
  return u.every((v,i)=>Math.abs(v-a[i])<0.0105);
}

/* ===== Генераторы: [тема, функция] → {q,a,s,m} ===== */
const GEN={5:{alg:[],geo:[],prob:[]},6:{alg:[],geo:[],prob:[]},7:{alg:[],geo:[],prob:[]},8:{alg:[],geo:[],prob:[]},9:{alg:[],geo:[],prob:[]}};
const add=(g,sec,topic,fn)=>GEN[g][sec].push([topic,fn]);

/* ---------- 5 класс · алгебра ---------- */
add(5,"alg","Порядок действий",()=>{const a=R(2,9),b=R(2,9),c=R(2,9);
  if(R(0,1)){const d=R(1,a+b*c-1);return{q:`Вычислите: ${a} + ${b} · ${c} − ${d}`,a:String(a+b*c-d),s:`Сначала умножение: ${b}·${c} = ${b*c}, затем сложение и вычитание.`}}
  const d=R(1,(a+b)*c-1);return{q:`Вычислите: (${a} + ${b}) · ${c} − ${d}`,a:String((a+b)*c-d),s:`Сначала скобки: ${a}+${b} = ${a+b}, затем умножение и вычитание.`}});
add(5,"alg","Простые уравнения",()=>{const t=R(0,3),x=R(3,40),k=R(2,9),a=R(5,40);
  if(t===0)return{q:`Решите уравнение: x + ${a} = ${x+a}`,a:`x = ${x}`,s:`x = ${x+a} − ${a} = ${x}`};
  if(t===1)return{q:`Решите уравнение: x − ${a} = ${x}`,a:`x = ${x+a}`,s:`x = ${x} + ${a} = ${x+a}`};
  if(t===2)return{q:`Решите уравнение: ${k}x = ${k*x}`,a:`x = ${x}`,s:`x = ${k*x} : ${k} = ${x}`};
  return{q:`Решите уравнение: x : ${k} = ${x}`,a:`x = ${x*k}`,s:`x = ${x} · ${k} = ${x*k}`}});
add(5,"alg","Обыкновенные дроби",()=>{const d=R(4,15),p=R(1,d-2),q=R(1,d-1-p);
  return{q:`Вычислите: ${p}/${d} + ${q}/${d}`,a:fr(p+q,d),s:`Знаменатели равны: складываем числители ${p}+${q} = ${p+q}; сократите дробь, если можно.`}});
add(5,"alg","Проценты",()=>{const p=pick([5,10,20,25,50]),N=R(1,20)*20;
  return{q:`Найдите ${p}% от числа ${N}.`,a:String(N*p/100),s:`${N} · ${p} : 100 = ${N*p/100}`}});
add(5,"alg","Текстовая задача",()=>{const t=R(0,2);
  if(t===0){const v=R(40,90),h=R(2,6);return{q:`Поезд идёт со скоростью ${v} км/ч. Какое расстояние он пройдёт за ${h} ч?`,a:`${v*h} км`,s:`S = v · t = ${v}·${h}`}}
  if(t===1){const k=R(3,9),p=R(8,30),q=R(10,60);return{q:`Купили ${k} тетрадей по ${p} руб. и ручку за ${q} руб. Сколько рублей заплатили?`,a:`${k*p+q} руб.`,s:`${k}·${p} + ${q}`}}
  const a=R(15,60),b=R(5,a-1);return{q:`В одном ящике ${a} кг яблок, в другом на ${b} кг меньше. Сколько килограммов яблок в двух ящиках?`,a:`${2*a-b} кг`,s:`${a} + (${a} − ${b})`}});

/* ---------- 5 класс · геометрия ---------- */
add(5,"geo","Прямоугольник",()=>{const a=R(3,15),b=R(2,12);
  return{q:`Стороны прямоугольника ${a} см и ${b} см. Найдите его площадь и периметр.`,a:`S = ${a*b} см², P = ${2*(a+b)} см`,s:`S = ab = ${a*b}; P = 2(a+b) = ${2*(a+b)}`}});
add(5,"geo","Квадрат",()=>{const a=R(2,12);
  return{q:`Периметр квадрата ${4*a} см. Найдите его площадь.`,a:`${a*a} см²`,s:`Сторона = ${4*a} : 4 = ${a}; S = ${a}² = ${a*a}`}});
add(5,"geo","Смежные углы",()=>{const a=R(20,160);
  return{q:`Один из смежных углов равен ${a}°. Найдите второй угол.`,a:`${180-a}°`,s:`Сумма смежных углов 180°: 180 − ${a} = ${180-a}`}});
add(5,"geo","Сторона прямоугольника",()=>{const a=R(3,14),b=R(2,12);
  return{q:`Площадь прямоугольника ${a*b} см², одна сторона ${a} см. Найдите другую сторону.`,a:`${b} см`,s:`b = S : a = ${a*b} : ${a}`}});

/* ---------- 5 класс · вероятность / комбинаторика ---------- */
add(5,"prob","Правило умножения",()=>{const a=R(2,6),b=R(2,6);
  return{q:`У Пети ${a} разных футболок и ${b} пар шорт. Сколько разных комплектов одежды он может составить?`,a:String(a*b),s:`${a}·${b}`}});
add(5,"prob","Выбор обеда",()=>{const a=R(2,4),b=R(2,5),c=R(2,4);
  return{q:`В меню ${a} вида супа, ${b} вторых блюд и ${c} напитка. Сколько различных обедов из трёх блюд (суп, второе, напиток) можно заказать?`,a:String(a*b*c),s:`${a}·${b}·${c}`}});
add(5,"prob","Числа из цифр",()=>{const t=R(0,1);
  if(t===0){const n=R(2,4);return{q:`Сколько двузначных чисел можно составить из цифр ${Array.from({length:n},(_,i)=>i+1).join(", ")} (цифры могут повторяться)?`,a:String(n*n),s:`${n}·${n}`}}
  return{q:`Сколько существует двузначных чисел с различными цифрами, составленных из цифр 1, 2, 3, 4?`,a:"12",s:"4·3 = 12"}});

/* ---------- 6 класс · алгебра ---------- */
add(6,"alg","Пропорция",()=>{const a=R(2,9),b=R(2,9),k=R(2,9);
  return{q:`Решите пропорцию: ${a} : ${b} = ${a*k} : x`,a:`x = ${b*k}`,s:`x = ${a*k}·${b} : ${a} = ${b*k}`}});
add(6,"alg","Отрицательные числа",()=>{const a=R(2,9),b=R(2,9),c=R(2,12);
  if(R(0,1))return{q:`Вычислите: (${M}${a}) · ${b} + ${c}`,a:String(-a*b+c),s:`(−${a})·${b} = ${-a*b}; ${-a*b} + ${c} = ${-a*b+c}`};
  return{q:`Вычислите: ${c} − (${M}${a}) · ${b}`,a:String(c+a*b),s:`(−${a})·${b} = ${-a*b}; ${c} − (${-a*b}) = ${c+a*b}`}});
add(6,"alg","Линейное уравнение",()=>{const a=R(2,9),x=R(-8,12),b=R(-20,20),c=a*x+b;
  return{q:`Решите уравнение: ${lin(a,b)} = ${num(c)}`,a:`x = ${x}`,s:`${a}x = ${c} ${b<0?"+":"−"} ${Math.abs(b)} = ${c-b}; x = ${x}`}});
add(6,"alg","Дроби с разными знаменателями",()=>{let d1,d2;do{d1=pick([2,3,4,5,6]);d2=pick([3,4,5,6,8,9,10])}while(d1===d2);
  const p=R(1,d1-1),q=R(1,d2-1);
  return{q:`Вычислите: ${p}/${d1} + ${q}/${d2}`,a:fr(p*d2+q*d1,d1*d2),s:`Общий знаменатель ${d1*d2}: (${p}·${d2} + ${q}·${d1})/${d1*d2}; сократите.`}});
add(6,"alg","Проценты в жизни",()=>{const N=R(2,30)*100,p=pick([5,10,15,20,25]),up=R(0,1);
  return up?{q:`Товар стоил ${N} руб. Цена выросла на ${p}%. Какова новая цена?`,a:`${N+N*p/100} руб.`,s:`${N}·${p}/100 = ${N*p/100}; ${N} + ${N*p/100}`}
   :{q:`Товар стоил ${N} руб. Скидка ${p}%. Сколько рублей придётся заплатить?`,a:`${N-N*p/100} руб.`,s:`${N}·${p}/100 = ${N*p/100}; ${N} − ${N*p/100}`}});

/* ---------- 6 класс · геометрия ---------- */
add(6,"geo","Длина окружности",()=>{const r=R(2,12);
  return{q:`Радиус окружности ${r} см. Найдите длину окружности (π ≈ 3,14).`,a:`${dec(2*3.14*r)} см`,s:`C = 2πr = 2·3,14·${r}`,m:"seq"}});
add(6,"geo","Площадь круга",()=>{const r=R(2,10);
  return{q:`Радиус круга ${r} см. Найдите площадь круга (π ≈ 3,14).`,a:`${dec(3.14*r*r)} см²`,s:`S = πr² = 3,14·${r}²`}});
add(6,"geo","Объём параллелепипеда",()=>{const a=R(2,12),b=R(2,10),c=R(2,9);
  return{q:`Измерения прямоугольного параллелепипеда ${a} см, ${b} см и ${c} см. Найдите объём.`,a:`${a*b*c} см³`,s:`V = abc = ${a}·${b}·${c}`}});
add(6,"geo","Вертикальные углы",()=>{const a=R(20,160);
  return{q:`Две прямые пересекаются. Один из образовавшихся углов равен ${a}°. Найдите угол, смежный с ним.`,a:`${180-a}°`,s:`180° − ${a}° = ${180-a}°`}});

/* ---------- 6 класс · вероятность ---------- */
add(6,"prob","Шары в мешке",()=>{const r=R(2,9),b=R(2,9);
  return{q:`В мешке ${r} красных и ${b} синих шаров. Наугад вынимают один шар. Какова вероятность, что он красный? (Ответ — обыкновенной дробью.)`,a:fr(r,r+b),s:`P = ${r}/${r+b}`}});
add(6,"prob","Выбор ученика",()=>{const n=R(20,35),k=R(3,n-5);
  return{q:`В классе ${n} учеников, из них ${k} — отличники. Случайно выбирают одного ученика. Какова вероятность, что он отличник?`,a:fr(k,n),s:`P = ${k}/${n}`}});
add(6,"prob","Перестановки",()=>{const n=R(3,4);
  return{q:`Сколькими способами можно расставить ${n} разных книг на полке в ряд?`,a:String(fact(n)),s:`${n}! = ${fact(n)}`}});

/* ---------- 7 класс · алгебра ---------- */
add(7,"alg","Уравнение со скобками",()=>{const a=R(2,7),x=R(-6,9);let b;do{b=R(-8,8)}while(b===0);
  return{q:`Решите уравнение: ${a}(x ${b>0?"+":M} ${Math.abs(b)}) = ${num(a*(x+b))}`,a:`x = ${x}`,s:`x ${b>0?"+":"−"} ${Math.abs(b)} = ${x+b}; x = ${x}`}});
add(7,"alg","Упростите выражение",()=>{let A,B,a,b,c,d,k;
  do{A=R(2,5);B=sgn()*R(1,5);a=R(1,6);c=R(1,6);b=R(-7,7);d=R(-7,7);k=A*a+B*c}while(k===0);
  return{q:`Упростите выражение: ${A}(${lin(a,b)}) ${B>0?"+":M} ${Math.abs(B)}(${lin(c,d)})`,a:lin(k,A*b+B*d),s:`Раскройте скобки и приведите подобные слагаемые.`,m:"exact"}});
add(7,"alg","Формулы сокращённого умножения",()=>{const a=R(2,9),t=R(0,2);
  if(t===0)return{q:`Раскройте скобки: (x + ${a})²`,a:quad(1,2*a,a*a),s:`(a+b)² = a² + 2ab + b²`,m:"exact"};
  if(t===1)return{q:`Раскройте скобки: (x ${M} ${a})²`,a:quad(1,-2*a,a*a),s:`(a−b)² = a² − 2ab + b²`,m:"exact"};
  return{q:`Раскройте скобки: (x ${M} ${a})(x + ${a})`,a:quad(1,0,-a*a),s:`(a−b)(a+b) = a² − b²`,m:"exact"}});
add(7,"alg","Линейная функция",()=>{let k;do{k=R(-5,5)}while(k===0);const b=R(-9,9),x0=R(-6,8);
  if(R(0,1))return{q:`Функция задана формулой y = ${lin(k,b)}. Найдите значение y при x = ${num(x0)}.`,a:`y = ${k*x0+b}`,s:`y = ${k}·(${x0}) + (${b}) = ${k*x0+b}`};
  return{q:`Функция задана формулой y = ${lin(k,b)}. При каком значении x значение функции равно ${num(k*x0+b)}?`,a:`x = ${x0}`,s:`${lin(k,b)} = ${k*x0+b}; x = ${x0}`}});
add(7,"alg","Система уравнений",()=>{const x=R(-5,10),y=R(-5,10);
  return{q:`Решите систему уравнений:\nx + y = ${num(x+y)}\nx ${M} y = ${num(x-y)}`,a:`x = ${x}; y = ${y}`,s:`Сложим уравнения: 2x = ${2*x}; x = ${x}; y = ${y}`,m:"seq"}});

/* ---------- 7 класс · геометрия ---------- */
add(7,"geo","Сумма углов треугольника",()=>{const A=R(30,80),B=R(30,80);
  return{q:`В треугольнике ABC ∠A = ${A}°, ∠B = ${B}°. Найдите ∠C.`,a:`${180-A-B}°`,s:`180° − ${A}° − ${B}°`}});
add(7,"geo","Равнобедренный треугольник",()=>{const v=2*R(10,60);
  return{q:`В равнобедренном треугольнике угол при вершине равен ${v}°. Найдите угол при основании.`,a:`${(180-v)/2}°`,s:`(180° − ${v}°) : 2`}});
add(7,"geo","Внешний угол треугольника",()=>{const A=R(30,80),B=R(30,80);
  return{q:`В треугольнике ABC ∠A = ${A}°, ∠B = ${B}°. Найдите внешний угол при вершине C.`,a:`${A+B}°`,s:`Внешний угол равен сумме двух внутренних, не смежных с ним.`}});
add(7,"geo","Параллельные прямые",()=>{const a=R(30,150);
  return{q:`Две параллельные прямые пересечены секущей. Один из внутренних односторонних углов равен ${a}°. Найдите второй.`,a:`${180-a}°`,s:`Сумма внутренних односторонних углов при параллельных прямых равна 180°.`}});

/* ---------- 7 класс · вероятность ---------- */
add(7,"prob","Игральная кость",()=>{const k=R(2,5);
  const ev=[["выпало чётное число очков",3],[`выпало число очков, большее ${k}`,6-k],[`выпало число очков, не меньшее ${k}`,7-k],["выпало простое число очков",3],["число очков кратно 3",2]];
  const [t,n]=pick(ev);
  return{q:`Игральную кость бросают один раз. Какова вероятность того, что ${t}?`,a:fr(n,6),s:`Благоприятных исходов ${n} из 6.`}});
add(7,"prob","Монеты",()=>{const t=R(0,3);
  const L=[["Монету бросают дважды. Какова вероятность, что оба раза выпадет орёл?","1/4","Всего 4 исхода: ОО, ОР, РО, РР."],
   ["Монету бросают дважды. Какова вероятность, что орёл выпадет ровно один раз?","1/2","Благоприятные: ОР, РО из 4."],
   ["Монету бросают трижды. Какова вероятность, что орёл выпадет ровно два раза?","3/8","Всего 8 исходов, благоприятных 3."],
   ["Монету бросают трижды. Какова вероятность, что хотя бы раз выпадет решка?","7/8","1 − P(все орлы) = 1 − 1/8"]][t];
  return{q:L[0],a:L[1],s:L[2]}});
add(7,"prob","Классическая вероятность",()=>{const n=R(20,40),k=R(3,n-5);
  return{q:`В коробке ${n} билетов, из них ${k} «счастливых». Какова вероятность вытянуть «счастливый» билет? Ответ дайте десятичной дробью с точностью до сотых.`,a:dec(k/n),s:`P = ${k}/${n} ≈ ${dec(k/n)}`}});

/* ---------- 8 класс · алгебра ---------- */
add(8,"alg","Квадратное уравнение",()=>{let r1,r2;do{r1=R(-9,9);r2=R(-9,9)}while(r1>=r2);
  return{q:`Решите уравнение: ${quad(1,-(r1+r2),r1*r2)} = 0`,a:`x₁ = ${r1}, x₂ = ${r2}`,s:`По теореме Виета: x₁ + x₂ = ${r1+r2}, x₁·x₂ = ${r1*r2}.`,m:"set"}});
add(8,"alg","Дискриминант",()=>{const a=R(1,4),b=R(-9,9),c=R(-9,9),D=b*b-4*a*c;
  return{q:`Для уравнения ${quad(a,b,c)} = 0 найдите дискриминант и число корней.`,a:`D = ${D}; ${D>0?2:D===0?1:0} ${D>0?"корня":D===0?"корень":"корней"}`,s:`D = b² − 4ac = ${b*b} − ${4*a*c} = ${D}`,m:"seq"}});
add(8,"alg","Квадратные корни",()=>{const k=R(2,6),m=pick([2,3,5,6,7]);
  return{q:`Вынесите множитель из-под знака корня: √${k*k*m}`,a:`${k}√${m}`,s:`√(${k*k}·${m}) = ${k}√${m}`,m:"seq"}});
add(8,"alg","Линейное неравенство",()=>{let a;do{a=R(-6,6)}while(Math.abs(a)<2);
  const x0=R(-5,8),b=R(-9,9),c=a*x0+b,s=pick([">","<","≥","≤"]);
  const flip={">":"<","<":">","≥":"≤","≤":"≥"};
  return{q:`Решите неравенство: ${lin(a,b)} ${s} ${num(c)}`,a:`x ${a>0?s:flip[s]} ${num(x0)}`,s:`${a<0?"При делении на отрицательное число знак неравенства меняется. ":""}x ${a>0?s:flip[s]} ${x0}`,m:"exact"}});
add(8,"alg","Вершина параболы",()=>{const x0=R(-5,5),y0=R(-9,9);
  return{q:`Найдите координаты вершины параболы y = ${quad(1,-2*x0,x0*x0+y0).replace(/x²/,"x²")}.`,a:`(${x0}; ${y0})`,s:`x₀ = −b/(2a) = ${x0}; y₀ = y(${x0}) = ${y0}`,m:"seq"}});

/* ---------- 8 класс · геометрия ---------- */
add(8,"geo","Теорема Пифагора",()=>{const [a,b,c]=pick(T3);
  if(R(0,1))return{q:`Катеты прямоугольного треугольника равны ${a} и ${b}. Найдите гипотенузу.`,a:String(c),s:`c² = ${a}² + ${b}² = ${a*a+b*b}`};
  return{q:`Гипотенуза прямоугольного треугольника равна ${c}, один из катетов ${a}. Найдите другой катет.`,a:String(b),s:`b² = ${c}² − ${a}² = ${c*c-a*a}`}});
add(8,"geo","Трапеция",()=>{const a=R(4,14),b=a+2*R(1,5),h=R(3,10),m=(a+b)/2;
  if(R(0,1))return{q:`Основания трапеции ${a} см и ${b} см, высота ${h} см. Найдите площадь.`,a:`${m*h} см²`,s:`S = (a+b)/2 · h = ${m}·${h}`};
  return{q:`Основания трапеции равны ${a} и ${b}. Найдите среднюю линию.`,a:String(m),s:`(${a} + ${b}) : 2`}});
add(8,"geo","Параллелограмм",()=>{const a=R(5,15),b=R(4,12),h=R(3,9);
  if(R(0,1))return{q:`Сторона параллелограмма ${a} см, высота, проведённая к ней, ${h} см. Найдите площадь.`,a:`${a*h} см²`,s:`S = a·h`};
  return{q:`Стороны параллелограмма равны ${a} см и ${b} см. Найдите периметр.`,a:`${2*(a+b)} см`,s:`P = 2(a+b)`}});
add(8,"geo","Диагональ прямоугольника",()=>{const [a,b,c]=pick(T3);
  return{q:`Стороны прямоугольника ${a} см и ${b} см. Найдите его диагональ.`,a:`${c} см`,s:`d² = ${a}² + ${b}²`}});
add(8,"geo","Ромб",()=>{const [p,q,h]=pick([[3,4,5],[6,8,10],[5,12,13]]);
  if(R(0,1))return{q:`Диагонали ромба равны ${2*p} см и ${2*q} см. Найдите площадь ромба.`,a:`${2*p*q} см²`,s:`S = d₁d₂/2`};
  return{q:`Диагонали ромба равны ${2*p} см и ${2*q} см. Найдите сторону ромба.`,a:`${h} см`,s:`Диагонали перпендикулярны и делятся пополам: сторона² = ${p}² + ${q}².`}});

/* ---------- 8 класс · вероятность ---------- */
add(8,"prob","Перестановки",()=>{const n=R(4,6);
  return{q:`Сколькими способами можно расставить ${n} разных книг на полке?`,a:String(fact(n)),s:`${n}! = ${fact(n)}`}});
add(8,"prob","Сочетания",()=>{const n=R(5,12),k=pick([2,2,3]);
  return{q:`Из ${n} учеников нужно выбрать ${k}-х дежурных (порядок не важен). Сколькими способами это можно сделать?`,a:String(Cmb(n,k)),s:`C(${n},${k}) = ${Cmb(n,k)}`}});
add(8,"prob","Рукопожатия",()=>{const n=R(5,15);
  return{q:`На встрече ${n} человек, каждый пожал руку каждому. Сколько всего было рукопожатий?`,a:String(n*(n-1)/2),s:`C(${n},2) = ${n}·${n-1}/2`}});
add(8,"prob","Два вынимания",()=>{const r=R(2,6),b=R(2,6),n=r+b;
  if(R(0,1))return{q:`В коробке ${r} красных и ${b} синих шаров. Шар вынимают, возвращают и вынимают снова. Какова вероятность, что оба раза шар красный?`,a:fr(r*r,n*n),s:`(${r}/${n})²`};
  return{q:`В коробке ${r} красных и ${b} синих шаров. Два шара вынимают подряд без возвращения. Какова вероятность, что оба красные?`,a:fr(r*(r-1),n*(n-1)),s:`(${r}/${n})·(${r-1}/${n-1})`}});

/* ---------- 9 класс · алгебра ---------- */
add(9,"alg","Арифметическая прогрессия",()=>{const a1=R(-5,10),d=R(2,7),n=R(8,15),an=a1+(n-1)*d,S=n*(2*a1+(n-1)*d)/2;
  return{q:`Арифметическая прогрессия: a₁ = ${num(a1)}, d = ${d}. Найдите a${sub(n)} и сумму первых ${n} членов S${sub(n)}.`,a:`a${sub(n)} = ${an}; S${sub(n)} = ${S}`,s:`aₙ = a₁ + (n−1)d; Sₙ = (a₁+aₙ)·n/2`,m:"seq"}});
add(9,"alg","Геометрическая прогрессия",()=>{const b1=R(1,5),q=pick([2,3,-2]),n=R(4,6),bn=b1*Math.pow(q,n-1);
  return{q:`Геометрическая прогрессия: b₁ = ${b1}, q = ${num(q)}. Найдите b${sub(n)}.`,a:`b${sub(n)} = ${bn}`,s:`bₙ = b₁·qⁿ⁻¹ = ${b1}·(${q})^${n-1}`}});
add(9,"alg","Нелинейная система",()=>{let r1,r2;do{r1=R(-6,8);r2=R(-6,8)}while(r1>=r2);
  return{q:`Решите систему уравнений:\nx + y = ${num(r1+r2)}\nxy = ${num(r1*r2)}`,a:`(${r1}; ${r2}) и (${r2}; ${r1})`,s:`x и y — корни уравнения t² − ${r1+r2}t + ${r1*r2} = 0.`,m:"set"}});
add(9,"alg","Квадратное неравенство",()=>{let r1,r2;do{r1=R(-7,8);r2=R(-7,8)}while(r1>=r2);const less=R(0,1);
  return{q:`Решите неравенство: ${quad(1,-(r1+r2),r1*r2)} ${less?"<":">"} 0`,a:less?`${num(r1)} < x < ${num(r2)}`:`x < ${num(r1)} или x > ${num(r2)}`,s:`Корни ${r1} и ${r2}; ветви параболы вверх.`,m:"set"}});
add(9,"alg","Уравнение с коэффициентом a > 1",()=>{let r1,r2;do{r1=R(-6,6);r2=R(-6,6)}while(r1>=r2);const a=pick([2,3]);
  return{q:`Решите уравнение: ${quad(a,-a*(r1+r2),a*r1*r2)} = 0`,a:`x₁ = ${r1}, x₂ = ${r2}`,s:`Разделите на ${a} и примените теорему Виета.`,m:"set"}});

/* ---------- 9 класс · геометрия ---------- */
add(9,"geo","Теорема косинусов",()=>{const [a,b,c,ang]=pick([[3,8,7,60],[5,8,7,60],[7,15,13,60],[8,15,13,60],[3,5,7,120],[7,8,13,120],[5,16,19,120],[8,7,13,120]]);
  return{q:`В треугольнике ABC AB = ${a}, AC = ${b}, ∠A = ${ang}°. Найдите BC.`,a:String(c),s:`BC² = ${a}² + ${b}² − 2·${a}·${b}·cos${ang}° = ${c*c}`}});
add(9,"geo","Теорема синусов",()=>{const a=2*R(2,9);
  if(R(0,1))return{q:`В треугольнике ABC BC = ${a}, ∠A = 30°. Найдите радиус описанной окружности.`,a:String(a),s:`BC/sinA = 2R; 2R = ${a}/0,5 = ${2*a}`};
  return{q:`В треугольнике ABC BC = ${a}, ∠A = 90°. Найдите радиус описанной окружности.`,a:String(a/2),s:`Гипотенуза — диаметр описанной окружности.`}});
add(9,"geo","Правильный многоугольник",()=>{const n=pick([5,6,8,9,10,12]);
  if(R(0,1))return{q:`Найдите угол правильного ${n}-угольника.`,a:`${(n-2)*180/n}°`,s:`(n−2)·180°/n`};
  return{q:`Найдите сумму внутренних углов выпуклого ${n}-угольника.`,a:`${(n-2)*180}°`,s:`(n−2)·180°`}});
add(9,"geo","Длина дуги и сектор",()=>{const al=pick([60,90,120,180,270]),Rr=6*R(1,3);
  if(R(0,1))return{q:`Радиус окружности ${Rr} см. Найдите длину дуги с градусной мерой ${al}° (ответ через π).`,a:`${Rr*al/180}π см`,s:`l = πRα/180 = π·${Rr}·${al}/180`,m:"seq"};
  const k=Rr/6;return{q:`Радиус круга ${Rr} см. Найдите площадь сектора с центральным углом ${al}° (ответ через π).`,a:`${36*k*k*al/360}π см²`,s:`S = πR²α/360`,m:"seq"}});
add(9,"geo","Длина вектора",()=>{const [dx,dy]=pick([[3,4],[6,8],[5,12],[8,15],[9,12]]).map(v=>v*sgn());const x1=R(-5,5),y1=R(-5,5);
  return{q:`Даны точки A(${num(x1)}; ${num(y1)}) и B(${num(x1+dx)}; ${num(y1+dy)}). Найдите длину вектора AB.`,a:String(Math.hypot(dx,dy)),s:`AB = √(${dx}² + ${dy}²)`}});

/* ---------- 9 класс · вероятность ---------- */
add(9,"prob","Сумма очков на двух кубиках",()=>{const s=R(2,12),c=Math.min(s-1,13-s);
  return{q:`Бросают два игральных кубика. Какова вероятность, что сумма очков равна ${s}?`,a:fr(c,36),s:`Благоприятных исходов ${c} из 36.`}});
add(9,"prob","Выбор двух из группы",()=>{const n=R(10,20),k=R(3,n-3);
  if(R(0,1))return{q:`В классе ${n} учеников, из них ${k} мальчиков. Случайно выбирают двоих. Какова вероятность, что оба — мальчики?`,a:fr(k*(k-1),n*(n-1)),s:`C(${k},2)/C(${n},2)`};
  return{q:`В классе ${n} учеников, из них ${k} мальчиков. Случайно выбирают двоих. Какова вероятность, что это мальчик и девочка?`,a:fr(2*k*(n-k),n*(n-1)),s:`${k}·${n-k}/C(${n},2)`}});
add(9,"prob","Хотя бы один",()=>{const n=R(2,5);
  if(R(0,1))return{q:`Монету бросают ${n} раз. Какова вероятность, что хотя бы один раз выпадет орёл?`,a:fr(Math.pow(2,n)-1,Math.pow(2,n)),s:`1 − (1/2)^${n}`};
  const p=pick([0.6,0.7,0.8,0.9]);
  return{q:`Стрелок попадает в цель с вероятностью ${String(p).replace(".",",")}. Он делает два выстрела. Найдите вероятность, что он попадёт оба раза и вероятность, что попадёт хотя бы раз (десятичными дробями).`,a:`${dec(p*p)}; ${dec(1-(1-p)*(1-p))}`,s:`p² и 1 − (1−p)²`,m:"seq"}});
add(9,"prob","Размещения",()=>{const n=R(5,9),k=pick([2,3]);let r=1;for(let i=0;i<k;i++)r*=n-i;
  return{q:`В забеге участвуют ${n} бегунов. Сколько существует вариантов распределения золотой, серебряной${k===3?" и бронзовой":""} медали?`,a:String(r),s:`A(${n},${k}) = ${r}`}});

/* ===== Встроенная база (оригинальные задачи) ===== */
const BANK=[
{grade:5,sec:"alg",q:"Турист в первый день прошёл 18 км, во второй — на 5 км больше, чем в первый, а в третий — на 10 км меньше, чем за первые два дня вместе. Сколько километров он прошёл за три дня?",a:"72 км"},
{grade:5,sec:"geo",q:"Периметр прямоугольника 36 см, одна из сторон 10 см. Найдите площадь прямоугольника.",a:"80 см²"},
{grade:5,sec:"prob",q:"Сколько различных трёхцветных флагов с тремя горизонтальными полосами можно составить из белого, синего и красного цветов (цвета не повторяются)?",a:"6"},
{grade:6,sec:"alg",q:"Велосипедист проехал 45 км за 3 часа. За сколько часов он проедет 75 км с той же скоростью?",a:"5 ч"},
{grade:6,sec:"geo",q:"Диаметр круга 10 см. Найдите площадь круга (π ≈ 3,14).",a:"78,5 см²"},
{grade:6,sec:"prob",q:"В мешке 4 белых и 6 чёрных шаров. Какова вероятность вынуть чёрный шар?",a:"3/5"},
{grade:7,sec:"alg",q:"Сумма двух чисел равна 48, а одно из них больше другого на 12. Найдите эти числа.",a:"30 и 18",m:"set"},
{grade:7,sec:"geo",q:"Боковая сторона равнобедренного треугольника 13 см, основание 10 см. Найдите периметр.",a:"36 см"},
{grade:7,sec:"prob",q:"Игральную кость бросают один раз. Какова вероятность того, что выпадет число очков, большее 4?",a:"1/3"},
{grade:8,sec:"alg",q:"Периметр прямоугольника 34 см, а площадь 60 см². Найдите его стороны.",a:"5 и 12",m:"set"},
{grade:8,sec:"geo",q:"Диагональ прямоугольника равна 17 см, одна из сторон 8 см. Найдите другую сторону.",a:"15 см"},
{grade:8,sec:"prob",q:"Сколькими способами из 8 учеников можно выбрать старосту и его заместителя?",a:"56"},
{grade:9,sec:"alg",q:"Второй член арифметической прогрессии равен 7, пятый — 19. Найдите разность прогрессии и первый член.",a:"d = 4, a₁ = 3",m:"seq"},
{grade:9,sec:"geo",q:"В треугольнике ABC AB = 5, AC = 8, ∠A = 60°. Найдите BC.",a:"7"},
{grade:9,sec:"prob",q:"Из 6 мальчиков и 4 девочек случайно выбирают двоих. Какова вероятность, что оба выбранных — девочки?",a:"2/15"}
];

if(typeof module!=="undefined")module.exports={GEN,BANK,check,nums,norm};
</script>

<script id="ui">
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SEC={alg:"Алгебра",geo:"Геометрия",prob:"Вероятность"};
let tasks=[],allOpen=false;

function userBank(){try{return JSON.parse(localStorage.getItem("userBank")||"[]")}catch(e){return[]}}
function saveBank(a){try{localStorage.setItem("userBank",JSON.stringify(a))}catch(e){}}
function bankInfo(){$("bankInfo").textContent=`В базе: встроенных ${BANK.length}, ваших ${userBank().length}.`}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}

function generate(){
  const gs=$("grade").value==="all"?[5,6,7,8,9]:[+$("grade").value];
  const secs=["alg","geo","prob"].filter(s=>$("s_"+s).checked);
  const n=Math.max(1,Math.min(50,+$("count").value||10));
  if(!secs.length){$("list").innerHTML='<div class="panel">Выберите хотя бы один раздел.</div>';tasks=[];return}
  const src=$("source").value;
  const pool=[];gs.forEach(g=>secs.forEach(s=>GEN[g][s].forEach(([t,fn])=>pool.push({g,s,t,fn}))));
  let bank=BANK.concat(userBank()).filter(b=>gs.includes(+b.grade)&&secs.includes(b.sec));
  shuffle(bank);
  let order=[],bi=0;tasks=[];
  for(let i=0;i<n;i++){
    if(!order.length)order=shuffle(pool.slice());
    const useBank=(src==="bank"&&bank.length)||(src==="mix"&&bank.length&&R(0,2)===0);
    if(useBank){const b=bank[bi++%bank.length];
      tasks.push({g:+b.grade,s:b.sec,t:"Из базы",q:b.q,a:b.a,sol:b.s||"",m:b.m||"seq"});
    }else{
      const p=order.pop();const r=p.fn();
      tasks.push({g:p.g,s:p.s,t:p.t,q:r.q,a:r.a,sol:r.s||"",m:r.m||"seq"});
    }
  }
  allOpen=false;render();
}

function render(){
  const chk=$("check").checked;
  $("list").innerHTML=tasks.map((t,i)=>`
  <div class="task" id="t${i}">
   <div><span class="tag">${t.g} класс</span><span class="tag">${SEC[t.s]||esc(t.s)}</span><span class="tag">${esc(t.t)}</span></div>
   <div class="q"><b>${i+1}.</b> ${esc(t.q)}</div>
   <div class="row noprint">
    ${chk?`<input type="text" id="u${i}" placeholder="Ваш ответ" style="flex:1;min-width:160px"><button data-chk="${i}">Проверить</button>`:""}
    <button data-show="${i}">Ответ</button><span class="res" id="r${i}"></span>
   </div>
   <div class="ans"><b>Ответ:</b> ${esc(t.a)}${t.sol?`<br><span class="mut">Решение: ${esc(t.sol)}</span>`:""}</div>
  </div>`).join("");
  stat();
}
function stat(){
  const total=tasks.filter(t=>t.done!==undefined).length,ok=tasks.filter(t=>t.done===true).length;
  $("stat").textContent=tasks.length?`Решено верно: ${ok} из ${tasks.length}`+(total?` (проверено ${total})`:""):"";
}

document.addEventListener("click",e=>{
  const c=e.target.dataset.chk,s=e.target.dataset.show;
  if(c!==undefined){const i=+c,t=tasks[i],v=$("u"+i).value;
    if(!v.trim())return;
    const ok=check(v,t.a,t.m);t.done=ok;
    const r=$("r"+i);r.textContent=ok?"✓ Верно":"✗ Неверно";r.className="res "+(ok?"ok":"bad");
    if(ok)$("t"+i).classList.add("open");stat();}
  if(s!==undefined)$("t"+s).classList.toggle("open");
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id&&e.target.id[0]==="u"&&e.target.type==="text"&&/^u\d+$/.test(e.target.id)){
  document.querySelector(`[data-chk="${e.target.id.slice(1)}"]`).click()}});

$("go").onclick=generate;
$("showAll").onclick=()=>{allOpen=!allOpen;document.querySelectorAll(".task").forEach(el=>el.classList.toggle("open",allOpen))};
$("print").onclick=()=>window.print();
$("copy").onclick=()=>{
  const txt=tasks.map((t,i)=>`${i+1}. ${t.q}`).join("\n\n")+"\n\nОтветы:\n"+tasks.map((t,i)=>`${i+1}) ${t.a}`).join("\n");
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>alert("Скопировано"),()=>{prompt("Скопируйте текст:",txt)});
};

function importBank(arr){
  if(!Array.isArray(arr))throw new Error("Ожидается массив задач");
  const ok=arr.filter(b=>b&&b.q&&b.a&&[5,6,7,8,9].includes(+b.grade)&&SEC[b.sec]).map(b=>({grade:+b.grade,sec:b.sec,q:String(b.q),a:String(b.a),s:b.s?String(b.s):"",m:b.m||"seq"}));
  if(!ok.length)throw new Error("Не найдено ни одной корректной задачи");
  saveBank(userBank().concat(ok));bankInfo();alert(`Добавлено задач: ${ok.length}`);
}
$("bankFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;
  try{importBank(JSON.parse(await f.text()))}catch(err){alert("Ошибка: "+err.message)}e.target.value=""};
$("bankLoad").onclick=async()=>{const u=$("bankUrl").value.trim();if(!u)return;
  try{const r=await fetch(u);if(!r.ok)throw new Error("HTTP "+r.status);importBank(await r.json())}
  catch(err){alert("Не удалось загрузить: "+err.message+"\nСсылка должна вести на JSON и разрешать CORS (подойдёт raw.githubusercontent.com).")}};
$("bankClear").onclick=()=>{if(confirm("Удалить все ваши задачи из базы?")){saveBank([]);bankInfo()}};

bankInfo();generate();
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
